name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: npm run validate

  # `docs/view/viewer.js` is a committed build artifact, so a change to
  # `src/web/**` only reaches the deployed share viewer if someone remembers to
  # run `npm run build:viewer` and commit the result. This job rebuilds it and
  # checks two independent things: that the committed bundle matches the
  # rebuild byte-for-byte, and that no new content-hashed chunk (e.g.
  # `docs/view/assets/statsWorker-<hash>.js`, emitted because the viewer
  # config sets `emptyOutDir: false`) was left untracked instead of committed.
  # Either check can fail the job on its own — a stale bundle and an unstaged
  # new chunk are different failure modes and neither should be able to mask
  # the other.
  #
  # An exact-bytes comparison is safe here because the build was measured to be
  # reproducible: the same sha256 came out of two local rebuilds on Node 24 and
  # a rebuild on Node 22, all matching the committed copy.
  viewer-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the share viewer bundle
        run: npm run build:viewer

      - name: Fail if the committed bundle is stale
        run: |
          status=0

          if ! git diff --exit-code -- docs/view; then
            echo "::error::docs/view is out of date. Run 'npm run build:viewer' and commit the result."
            status=1
          fi

          untracked="$(git status --porcelain --untracked-files=all -- docs/view)"
          if [ -n "$untracked" ]; then
            echo "::error::docs/view has untracked files that must be committed: $untracked. Run 'git add' on them and commit."
            status=1
          fi

          exit "$status"

      - name: Fail if the bundle reaches for Node globals
        run: node scripts/check-viewer-globals.mjs

  audit-boons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit boon generation
        run: npm run audit:boons

  audit-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit combat metrics
        run: npm run audit:metrics

  audit-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both audits read `test-fixtures/native/`, which is committed. They are
      # the only coverage for the migrated condition readers: the fixtures under
      # `test-fixtures/boon/` are Elite-Insights-shaped and carry no Axilog data,
      # so those readers early-return and compute nothing against them.
      - name: Audit conditions against baselines
        run: npm run audit:conditions

      - name: Audit condition consistency
        run: npm run audit:conditions:consistency

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The root vitest config globs only `src/**`, so `test:unit` below never
      # reaches the workspace packages. Run their suites explicitly, and run
      # them before the slow Playwright install so a regression fails fast.
      - name: Package unit tests
        run: npm test --workspace packages/bridge-metrics

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Unit tests
        run: npm run test:unit

      - name: Web E2E tests
        run: npm run test:e2e:web

      # `pretest:e2e:app` builds dist-react, which the app config serves.
      - name: App E2E tests
        run: npm run test:e2e:app

      - name: Electron E2E tests
        run: xvfb-run -a npm run test:e2e:electron

  # Windows exists as its own job for one reason: the native parser binding.
  # `src/test/axilogOracle.ts` and the bridge-metrics native suites load
  # `@axiapps/axilog` and parse a real `.zevtc` fixture, so this is the only
  # place `@axiapps/axilog-win32-x64-msvc` is exercised at all — the Linux job
  # never touches it.
  #
  # Deliberately no Playwright: the Electron E2E step is written around
  # `xvfb-run`, which does not exist here, and the browser install would
  # dominate the job for coverage the Linux `tests` job already provides.
  #
  # What this still cannot prove: the tests resolve the binding from
  # `node_modules`, not from inside a packed `app.asar`. Whether the `.node`
  # loads from an installed NSIS build is only answered by installing one.
  tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package unit tests
        run: npm test --workspace packages/bridge-metrics

      - name: Unit tests
        run: npm run test:unit
