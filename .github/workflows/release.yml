name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Read-only: the site is a branch-based Pages site rebuilt by GitHub on push
  # to main. This workflow only polls the build's status (see purge-cache).
  pages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit boon generation
        run: npm run audit:boons

      - name: Audit combat metrics
        run: npm run audit:metrics

      - name: Audit conditions consistency
        run: npm run audit:conditions:consistency

      - name: Unit tests
        run: npm run test:unit

  build:
    needs: [test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage
          - os: windows-latest
            platform: win
            args: --win nsis
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build and publish Electron distributables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }} --publish always

  # There is deliberately no Pages *deploy* job here.
  #
  # bridge.axi.link is a legacy, branch-based Pages site served from
  # `main:/docs` — the landing page, CNAME, the docs pages and the share
  # viewer under /view all live there, committed, and GitHub rebuilds the site
  # on every push to main. A release does not need to publish it.
  #
  # This job used to exist and uploaded `dist-web` as a Pages artifact, which
  # broke the site on every tag: `vite.web.config.ts` builds a single entry at
  # `web/index.html`, so dist-web has no root index.html and no `view/` at all.
  # Deploying it replaced the whole site with a tree that 404s on `/`,
  # `/view/viewer.js` and `/reports/*`. Cloudflare then served the old cached
  # copies for four hours, so the outage only surfaced once the edge expired —
  # which is what made the 2026-09-24 white-page hunt so confusing.
  #
  # What a release *does* still owe the site is the cache purge below.
  purge-cache:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      # The release commit is already on main, so GitHub has a docs/ build in
      # flight. Purging ahead of it would just re-cache the old content.
      - name: Wait for the GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 40); do
            status=$(gh api repos/${{ github.repository }}/pages/builds/latest -q .status)
            echo "pages build: $status"
            case "$status" in
              queued|building) sleep 15 ;;
              *) exit 0 ;;
            esac
          done
          echo "::warning::Pages build did not settle within 10 minutes; purging anyway."

      # GitHub serves its 404s with `cache-control: max-age=14400`, so a deploy
      # that replaces a previously-missing asset stays invisible at the edge for
      # four hours — which reads exactly like the deploy did nothing.
      #
      # Fail-soft: the CDN must not be able to fail a release, but the warning
      # names the consequence so it is actionable.
      - name: Purge Cloudflare cache for bridge.axi.link
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # axi.link. Not a secret — a zone id is useless without the token.
          ZONE_ID: 1b78a62a76bc7797fc56d661a11f3b57
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — skipping the edge-cache purge. bridge.axi.link may serve stale assets (or a cached 404) for up to 4 hours."
            exit 0
          fi

          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          if printf '%s' "$response" | grep -q '"success":[[:space:]]*true'; then
            echo "Purged the Cloudflare cache for axi.link."
          else
            # The deploy token's template ("Edit Cloudflare Workers") does not
            # include Cache Purge; add Zone -> Cache Purge -> Purge on axi.link
            # if this fails with an authentication error.
            echo "::warning::Cloudflare purge failed — bridge.axi.link may serve stale assets for up to 4 hours. Response: $response"
          fi

  # The share Worker ships on the same tag as the app that talks to it.
  #
  # Until this existed the Worker moved only when someone deployed it by hand,
  # so a release could ship a client expecting a route the live Worker did not
  # have. It runs off `test` rather than `build`, because nothing about the
  # Electron artifacts gates it — and ahead of `publish`, so the route a
  # release's clients call is live before the release is announced.
  #
  # Skips with a warning when CLOUDFLARE_API_TOKEN is unset, rather than
  # failing: a fork, or this repo before the secret is added, must still be
  # able to cut a release. Give the token the "Edit Cloudflare Workers"
  # template scoped to the axi.link zone.
  deploy-worker:
    needs: [test]
    runs-on: ubuntu-latest
    # Via env, not `secrets.* != ''` directly: the secrets context is not
    # available in an `if` conditional, where it evaluates to empty and would
    # skip the deploy silently on every run.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set — skipping the share Worker deploy. bridge.axi.link/r will keep serving whatever was deployed last."

      - name: Deploy share Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.toml

  publish:
    needs: [build, deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # Extract just this tag's section from RELEASE_NOTES.md.
          notes=$(awk -v ver="$tag" '
            /^Version v[0-9]/ { capture = ($2 == ver) ? 1 : 0; next }
            capture { print }
          ' RELEASE_NOTES.md)

          # Fail loudly if there is no section for this tag, so a release is
          # never published with empty or stale notes.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No RELEASE_NOTES.md section found for $tag. Add a 'Version $tag — <date>' entry and re-run." >&2
            exit 1
          fi

          gh release edit "$tag" --notes "$notes"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release edit "$tag" --draft=false

      - name: Post to Discord
        if: ${{ vars.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          release_url="https://github.com/darkharasho/axibridge/releases/tag/${tag}"
          notes=$(gh release view "$tag" --json body --jq '.body' 2>/dev/null || echo "")

          export TAG="$tag"
          export RELEASE_URL="$release_url"
          export NOTES="$notes"

          payload=$(python3 -c "
          import json, os

          tag = os.environ['TAG']
          release_url = os.environ['RELEASE_URL']
          notes = os.environ.get('NOTES', '')

          if len(notes) > 3800:
              notes = notes[:3800] + '\n\n*... see full notes on GitHub*'

          embed = {
              'title': f'AxiBridge {tag}',
              'url': release_url,
              'description': notes or 'A new version of AxiBridge is available!',
              'color': 0xF59E0B,
              'thumbnail': {'url': 'https://raw.githubusercontent.com/darkharasho/axibridge/main/build/icon.png'},
              'footer': {'text': 'AxiBridge Release'},
          }

          print(json.dumps({
              'embeds': [embed],
          }))
          ")

          curl -s -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
